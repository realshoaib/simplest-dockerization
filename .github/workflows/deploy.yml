name: CI/CD GitHub Pages Deployment By Shoaib

on:
  push:
    branches:
      - master # Triggers the pipeline every time you push to the MASTER branch

permissions:
  contents: write # Allows GitHub Actions to push files to your repository

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Clean up any previous dist directories on the runner host
      - name: Clean runner host
        run: rm -rf ./dist

      - name: Build Docker Image
        run: docker build --no-cache -t simplest-dockerization .

      # 2. Force remove any existing 'builder' container, run fresh, and copy files
      - name: Extract Built Files from Container
        run: |
          docker rm -f builder || true
          docker run --name builder simplest-dockerization
          docker cp builder:/app/dist ./dist
          docker rm -f builder

      # 3. Deploy using strict force_orphan to wipe out old cache on the gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true # Wipes out previous commit history on gh-pages to ensure only latest files remain
